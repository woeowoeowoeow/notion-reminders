name: Check Incomplete Tasks

on:
  schedule:
    - cron: '30 */3 * * *'   # every 3 hours, at :30, UTC (offset from the hourly job)
  workflow_dispatch:          # lets you trigger it manually to test

permissions:
  contents: read

# All jobs share one Notion connection; queue rather than cancel waiting runs.
concurrency:
  group: notion-automation
  queue: max
  cancel-in-progress: false

env:
  TZ: America/New_York

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python check_notion.py not_done
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
