name: Morning Brief

on:
  schedule:
    # 6 AM US/Eastern year-round. GitHub Actions cron is UTC-only and does
    # not shift for daylight saving, so we fire at both UTC offsets that
    # 6 AM Eastern can map to; morning_brief.py checks the real Eastern
    # local time and only sends on the one that actually is 6 AM.
    - cron: "0 10 * * *"  # 6 AM EDT (UTC-4) -- roughly mid-Mar to early Nov
    - cron: "0 11 * * *"  # 6 AM EST (UTC-5) -- roughly early Nov to mid-Mar
  workflow_dispatch:

jobs:
  send-brief:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install requests feedparser pytz

    - name: Run morning brief
      env:
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        python3 morning_brief.py
