name: Sync D2L Brightspace Assignments to Notion

on:
  schedule:
    - cron: '30 6 * * *'   # once daily, 6:30 AM UTC
  workflow_dispatch:        # lets you trigger it manually to test

permissions:
  contents: read

# All jobs share one Notion connection; queue rather than cancel waiting runs.
concurrency:
  group: notion-automation
  queue: max
  cancel-in-progress: false

env:
  TZ: America/New_York

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python d2l_sync.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          D2L_KSU_ICS_URL: ${{ secrets.D2L_KSU_ICS_URL }}
