name: Check Incomplete Tasks

on:
  schedule:
    - cron: '30 */3 * * *'   # every 3 hours, at :30, UTC (offset from the hourly job)
  workflow_dispatch:          # lets you trigger it manually to test

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python check_notion.py not_done
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
