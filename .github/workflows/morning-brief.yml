name: Morning Brief

on:
  schedule:
    # Both UTC offsets cover Eastern DST. The script accepts late starts
    # after 6 AM and uses a persistent receipt to skip the second delivery.
    - cron: "17 10 * * *"
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

# All jobs share one Notion connection; queue rather than cancel waiting runs.
concurrency:
  group: notion-automation
  queue: max
  cancel-in-progress: false

env:
  TZ: America/New_York

jobs:
  send-brief:
    permissions:
      contents: write  # Delivery receipt on automation-state only.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run morning brief
      env:
        GITHUB_TOKEN: ${{ github.token }}
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        python3 morning_brief.py
